name: Build Single-File GlassTaskbar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC (C++ Compiler)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile All-in-One EXE
      run: |
        mkdir publish
        cl /O2 /EHsc /std:c++20 /SUBSYSTEM:WINDOWS main.cpp /Fe:publish/GlassTaskbar.exe

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GlassTaskbar-AllInOne
        path: ./publish/GlassTaskbar.exe
