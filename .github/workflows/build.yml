name: Build GlassTaskbar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build GlassHook.dll
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE /LD GlassHook.cpp /link /OUT:GlassHook.dll user32.lib ole32.lib oleaut32.lib shell32.lib
          dir

      - name: Build GlassTaskbar.exe
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE main.cpp /link /OUT:GlassTaskbar.exe user32.lib ole32.lib oleaut32.lib shell32.lib
          dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassTaskbar-x64
          path: |
            GlassHook.dll
            GlassTaskbar.exe
